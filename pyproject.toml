[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reveng"
version = "0.1.0"
description = "An educational x86-64 Windows PE decompiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pefile>=2024.8.26",
    "capstone>=5.0.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
reveng = "reveng.cli:main"
